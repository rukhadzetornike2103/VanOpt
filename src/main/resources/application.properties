spring.application.name=VanOpt

# Your Neon Database Connection stays exactly the same
spring.datasource.url=jdbc:postgresql://YOUR_NEON_URL_HERE
spring.datasource.username=YOUR_NEON_USERNAME
spring.datasource.password=YOUR_NEON_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# 1. Turn OFF the beginner auto-generation (Change this to validate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# 2. Tell Flyway not to panic if the database already has stuff in it from our earlier tests
spring.flyway.baseline-on-migrate=true